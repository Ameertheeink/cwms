spring.application.name=corporate-website-management-system

spring.datasource.url=jdbc:mysql://localhost:3306/corporate_website_db
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# LOGGING
# ===============================
logging.level.root=INFO
logging.level.com.corporatewebsite=INFO

logging.file.name=logs/cwms.log

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# ==========================================
# File Storage Configuration
# ==========================================

file.upload-dir=uploads
file.max-image-size=5242880
file.max-video-size=104857600

# ==========================================
# Spring Multipart Configuration
# ==========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

# ==========================================
# Swagger / OpenAPI
# ==========================================

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# JWT Configuration
jwt.secret=ThisIsMyVerySecretKeyForCorporateWebsiteManagementSystem2026
jwt.expiration=86400000